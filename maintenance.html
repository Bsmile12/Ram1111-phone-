<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Vocab Master · ปิดปรับปรุงชั่วคราว</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a12;--card:#1a1a2e;--brd:rgba(255,255,255,.07);--ac:#7c6af7;--ac2:#f76a8c;--tx:#f0f0ff;--mu:rgba(240,240,255,.55)}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font-family:'Kanit',system-ui,sans-serif}
  header{padding:16px 20px;border-bottom:1px solid var(--brd)}
  .logo{font-family:'Space Mono',monospace;font-weight:700;font-size:14px;color:var(--ac);letter-spacing:-1px;text-decoration:none}
  .logo span{color:var(--ac2)}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 16px}
  .box{position:relative;max-width:420px;width:100%;text-align:center;background:var(--card);border:1px solid var(--brd);border-radius:16px;padding:32px 22px}
  .box::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:16px 16px 0 0;background:linear-gradient(90deg,var(--ac),var(--ac2))}
  .ic{font-size:44px;display:block;margin-bottom:10px}
  h1{font-size:20px;margin:0 0 8px}
  p{color:var(--mu);font-size:14px;line-height:1.6;margin:0 0 20px}
  .btn{display:inline-block;padding:12px 22px;border-radius:11px;color:#fff;text-decoration:none;font-weight:600;background:linear-gradient(135deg,var(--ac),var(--ac2))}
</style>
</head>
<body>
  <header><a class="logo" href="/">VOCAB<span>MASTER</span></a></header>
  <main>
    <div class="box">
      <span class="ic">&#128679;</span>
      <h1>หน้าข้อสอบปิดปรับปรุงชั่วคราว</h1>
      <p>กำลังปรับปรุงเนื้อหาเฉลยให้ดีขึ้น จะเปิดให้ใช้อีกครั้งเร็ว ๆ นี้<br>ระหว่างนี้ยังฝึกคำศัพท์และแบบฝึก Tenses ได้ตามปกติครับ</p>
      <a class="btn" href="/">กลับหน้าหลัก</a>
    </div>
  </main>
</body>
</html>
