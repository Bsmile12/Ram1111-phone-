<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vocab Master · สถิติข้อสอบ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a12; --bg-2:#1a1a2e; --bg-3:#22223a;
    --text:#f0f0ff; --text-soft:rgba(240,240,255,.55);
    --accent:#7c6af7; --accent-hover:#9585ff; --accent-2:#f76a8c;
    --border:rgba(255,255,255,.07); --border-light:rgba(255,255,255,.12);
    --good:#3dd68c; --mid:#f7c76a; --bad:#f76a6a;
    --body:'Kanit',system-ui,-apple-system,sans-serif;
    --mono:'Space Mono',ui-monospace,Consolas,monospace;
    --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;color:var(--text);font-family:var(--body);background:var(--bg);
    background-image:radial-gradient(ellipse 80% 50% at 50% -10%, rgba(124,106,247,.10) 0%, transparent 60%);
    min-height:100dvh;display:flex;flex-direction:column;}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;
    flex-wrap:wrap;background:rgba(10,10,18,.85);backdrop-filter:blur(12px);position:sticky;top:0;z-index:10;}
  .logo{width:44px;height:44px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:12px;letter-spacing:.5px;color:#fff;background:var(--accent);border-radius:10px;
    text-align:center;line-height:1.1}
  .head-txt{display:flex;flex-direction:column;gap:2px;flex:1 1 160px;min-width:150px}
  .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-soft)}
  header h1{font-size:17px;margin:0;font-weight:600;line-height:1.2}
  .head-actions{margin-left:auto;display:flex;align-items:center;gap:8px;flex:0 0 auto}
  .nav-link{background:var(--bg-2);border:1px solid var(--border);color:var(--text);padding:8px 14px;cursor:pointer;
    font-size:12.5px;text-decoration:none;white-space:nowrap;border-radius:8px;transition:.2s}
  .nav-link:hover{background:var(--accent);border-color:var(--accent);color:#fff}
  .hamburger{display:none;margin-left:auto;background:var(--bg-2);border:1px solid var(--border);
    color:var(--text);width:40px;height:40px;border-radius:8px;cursor:pointer;font-size:18px;
    align-items:center;justify-content:center;flex:0 0 auto}
  @media(max-width:560px){
    header{padding:10px 14px;gap:10px}
    .logo{width:38px;height:38px;font-size:11px}
    .eyebrow{display:none}
    header h1{font-size:15px}
    .hamburger{display:flex}
    .head-actions{position:absolute;top:100%;right:10px;left:10px;margin:8px 0 0;
      flex-direction:column;align-items:stretch;gap:8px;
      background:var(--bg-2);border:1px solid var(--border);border-radius:12px;
      padding:10px;box-shadow:0 12px 30px rgba(0,0,0,.45);display:none;z-index:30}
    .head-actions.open{display:flex}
    .head-actions .nav-link{width:100%;text-align:center;padding:12px;font-size:14px}
  }
  main{flex:1;width:100%;max-width:820px;margin:0 auto;padding:24px 16px 60px}
  h2{font-size:20px;margin:0 0 4px;font-weight:600}
  .muted{color:var(--text-soft);font-size:13.5px;line-height:1.6}
  .card{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin:14px 0}
  .card h3{margin:0 0 12px;font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
  @media(max-width:560px){.tiles{grid-template-columns:1fr}}
  .tile{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center}
  .tile .big{font-size:34px;font-weight:700;font-family:var(--mono);line-height:1}
  .tile .lbl{color:var(--text-soft);font-size:12.5px;margin-top:6px}
  /* horizontal bar rows */
  .brow{display:grid;grid-template-columns:120px 1fr auto;align-items:center;gap:11px;margin:9px 0}
  @media(max-width:560px){.brow{grid-template-columns:96px 1fr auto}}
  .brow .lbl{font-size:13px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .brow .track{height:20px;background:var(--bg-3);border-radius:6px;overflow:hidden;position:relative}
  .brow .track>i{display:block;height:100%;border-radius:6px;transition:width .5s}
  .brow .val{font-family:var(--mono);font-size:12px;color:var(--text-soft);white-space:nowrap;text-align:right}
  .pill{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--border)}
  .trend{display:flex;align-items:flex-end;gap:4px;height:90px;padding-top:6px}
  .trend .bar{flex:1;min-width:6px;background:var(--accent);border-radius:3px 3px 0 0;position:relative;transition:height .4s}
  .trend .bar:hover{background:var(--accent-hover)}
  .qmiss{border-top:1px solid var(--border);padding:11px 0;display:flex;gap:10px;align-items:flex-start}
  .qmiss:first-child{border-top:none}
  .qmiss .rank{font-family:var(--mono);color:var(--bad);font-weight:600;flex:0 0 auto}
  .qmiss .stem{font-size:14px;line-height:1.5;flex:1}
  .qmiss .cnt{font-family:var(--mono);font-size:12px;color:var(--text-soft);white-space:nowrap;flex:0 0 auto}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#fff;
    border:none;padding:12px 22px;font-family:var(--body);font-weight:600;cursor:pointer;font-size:15px;
    border-radius:var(--radius);transition:.2s;text-decoration:none}
  .btn:hover{background:var(--accent-hover)}
  .btn.ghost{background:var(--bg-2);border:1px solid var(--border);color:var(--text)}
  .btn.danger{background:transparent;border:1px solid var(--border);color:var(--text-soft)}
  .btn.danger:hover{background:var(--bad);border-color:var(--bad);color:#fff}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .empty{text-align:center;padding:50px 20px}
  .empty .em{font-size:44px}
  .legend{font-size:11.5px;color:var(--text-soft);margin-top:10px;display:flex;gap:14px;flex-wrap:wrap}
  .legend b{font-weight:600}
  .dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
  .foot-note{max-width:820px;margin:18px auto 0;text-align:center;color:var(--text-soft);font-size:11px;line-height:1.6}
  /* Vocab Master look */
  .vm-logo{font-family:var(--mono);font-weight:700;font-size:14px;color:var(--accent);letter-spacing:-1px;text-decoration:none;white-space:nowrap;flex:0 0 auto}
  .vm-logo span{color:var(--accent-2)}
  .btn:not(.ghost):not(.danger){background:linear-gradient(135deg,var(--accent),var(--accent-2))}
  .btn:not(.ghost):not(.danger):hover{background:linear-gradient(135deg,var(--accent-hover),var(--accent-2));box-shadow:0 4px 15px rgba(124,106,247,.3)}
  @media(max-width:560px){.vm-logo{font-size:12px}.head-txt{flex:1 1 0!important;min-width:0!important}}
</style>
</head>
<body>
  <header>
    <a class="vm-logo" href="index.html">VOCAB<span>MASTER</span></a>
    <div class="head-txt">
      <span class="eyebrow">RAM 1111 · สถิติการฝึก</span>
      <h1>Dashboard · จุดอ่อนของฉัน</h1>
    </div>
    <button class="hamburger" id="hamburger" aria-label="เมนู" aria-expanded="false">☰</button>
    <div class="head-actions" id="headActions">
      <a class="nav-link" href="index.html">🏠 หน้าหลัก</a>
      <a class="nav-link" href="exam.html">✍️ ทำข้อสอบ</a>
      <a class="nav-link" href="tenses.html">📝 แบบฝึก</a>
    </div>
  </header>
  <main id="app"></main>
  <div class="foot-note">สถิติเก็บในเครื่องนี้เท่านั้น (localStorage) · ไม่ได้ซิงก์ข้ามอุปกรณ์</div>

<script>
const app=document.getElementById('app');
const KEY='ram1111_stats';

// mobile hamburger menu
(function(){
  const hb=document.getElementById('hamburger'), ha=document.getElementById('headActions');
  hb.addEventListener('click',e=>{e.stopPropagation();
    const open=ha.classList.toggle('open'); hb.setAttribute('aria-expanded',open?'true':'false');});
  document.addEventListener('click',e=>{
    if(ha.classList.contains('open')&&!ha.contains(e.target)&&e.target!==hb){
      ha.classList.remove('open'); hb.setAttribute('aria-expanded','false');}});
})();
const TOPIC_TH={tense:'Tense',pronoun:'สรรพนาม',article:'Article','subject-verb-agreement':'ประธาน-กริยา',
  preposition:'บุพบท',conjunction:'คำเชื่อม',modal:'Modal','gerund-infinitive':'Gerund/Infinitive',
  'passive-voice':'Passive',comparison:'ขั้นกว่า/สุด','question-formation':'ประโยคคำถาม',
  'relative-clause':'Relative',conditional:'เงื่อนไข',quantifier:'ปริมาณ','word-order':'เรียงคำ',
  'part-of-speech':'ชนิดคำ','tag-question':'Tag Q',synonym:'คำเหมือน',antonym:'คำตรงข้าม',
  'meaning-in-context':'ความหมายในบริบท',collocation:'คำที่ใช้คู่','idiom-phrasal':'สำนวน/Phrasal',
  'word-choice':'เลือกคำ',other:'อื่นๆ'};
const DIFF_TH={easy:'ง่าย',medium:'ปานกลาง',hard:'ยาก'};

function load(){ try{return JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){return {};} }
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
// color by accuracy: red(low)->yellow->green(high)
function accColor(acc){ return acc>=0.8?'var(--good)':acc>=0.6?'var(--mid)':'var(--bad)'; }

function barRows(obj, nameMap){
  // obj: {key:[attempts,wrong]} -> rows sorted worst accuracy first (min 1 attempt)
  const rows=Object.entries(obj).filter(([k,v])=>v[0]>0)
    .map(([k,[n,w]])=>({k,n,w,acc:(n-w)/n}))
    .sort((a,b)=>a.acc-b.acc || b.w-a.w);
  return rows.map(r=>`
    <div class="brow">
      <span class="lbl" title="${esc(nameMap[r.k]||r.k)}">${esc(nameMap[r.k]||r.k)}</span>
      <span class="track"><i style="width:${Math.round(r.acc*100)}%;background:${accColor(r.acc)}"></i></span>
      <span class="val">${Math.round(r.acc*100)}% · พลาด ${r.w}/${r.n}</span>
    </div>`).join('');
}

function render(){
  const S=load();
  const sessions=S.sessions||[];
  if(!sessions.length){
    app.innerHTML=`<div class="card empty">
      <div class="em">📊</div>
      <h2>ยังไม่มีสถิติ</h2>
      <p class="muted">ทำข้อสอบให้จบอย่างน้อย 1 ชุด แล้วกลับมาดูว่าคุณพลาดหมวดไหนบ่อยสุด</p>
      <div class="row" style="justify-content:center"><a class="btn" href="exam.html">เริ่มทำข้อสอบ →</a></div>
    </div>`;
    return;
  }
  const topics=S.topics||{}, diff=S.diff||{}, parts=S.parts||{}, q=S.q||{};
  let totN=0,totW=0; for(const k in topics){totN+=topics[k][0];totW+=topics[k][1];}
  const acc=totN?Math.round((totN-totW)/totN*100):0;

  // weakest topic headline
  const weak=Object.entries(topics).filter(([k,v])=>v[0]>=2)
    .map(([k,[n,w]])=>({k,n,w,acc:(n-w)/n})).sort((a,b)=>a.acc-b.acc)[0];

  // trend: last 20 sessions score %
  const last=sessions.slice(-20);
  const maxN=Math.max(...last.map(s=>s.n));
  const trend=last.map(s=>{const p=Math.round(s.c/s.n*100);
    return `<div class="bar" style="height:${Math.max(6,p)}%" title="${new Date(s.t).toLocaleString('th-TH')} · ${s.c}/${s.n} (${p}%)"></div>`;}).join('');

  // most-missed questions (by wrong count, then wrong rate)
  const miss=Object.entries(q).map(([id,e])=>({id,n:e[0],w:e[1],stem:e[2],topic:e[3]}))
    .filter(x=>x.w>0).sort((a,b)=>b.w-a.w || (b.w/b.n)-(a.w/a.n)).slice(0,10);
  const missHtml=miss.length? miss.map((m,i)=>`
    <div class="qmiss"><span class="rank">${i+1}</span>
      <span class="stem">${esc(m.stem)}<br><span class="pill" style="margin-top:4px;display:inline-block">${TOPIC_TH[m.topic]||m.topic}</span></span>
      <span class="cnt">พลาด ${m.w}/${m.n}</span></div>`).join('')
    : '<p class="muted">ยังไม่มีข้อที่พลาดซ้ำ 🎉</p>';

  app.innerHTML=`
    <h2>ภาพรวมการฝึก</h2>
    <p class="muted">${weak?`จุดอ่อนที่สุดตอนนี้คือ <b style="color:var(--bad)">${TOPIC_TH[weak.k]||weak.k}</b> (แม่น ${Math.round(weak.acc*100)}%) — โฟกัสหมวดนี้ก่อน`:'ทำเพิ่มอีกหน่อยเพื่อดูจุดอ่อนที่ชัดขึ้น'}</p>

    <div class="tiles">
      <div class="tile"><div class="big">${sessions.length}</div><div class="lbl">ครั้งที่ทำ</div></div>
      <div class="tile"><div class="big">${totN}</div><div class="lbl">ข้อที่ทำทั้งหมด</div></div>
      <div class="tile"><div class="big" style="color:${accColor(acc/100)}">${acc}%</div><div class="lbl">ความแม่นรวม</div></div>
    </div>

    <div class="card">
      <h3>🎯 จุดอ่อนตามหัวข้อ <span class="muted" style="font-weight:400;font-size:12px">(เรียงจากแย่สุด)</span></h3>
      ${barRows(topics,TOPIC_TH) || '<p class="muted">—</p>'}
      <div class="legend">
        <span><span class="dot" style="background:var(--bad)"></span>&lt;60% ต้องซ่อม</span>
        <span><span class="dot" style="background:var(--mid)"></span>60–79% พอใช้</span>
        <span><span class="dot" style="background:var(--good)"></span>≥80% แม่น</span>
      </div>
    </div>

    <div class="card">
      <h3>📚 แกรมม่า vs ศัพท์ · ตามความยาก</h3>
      ${barRows(parts,{grammar:'แกรมม่า',vocab:'ศัพท์'})}
      <div style="height:8px"></div>
      ${barRows(diff,DIFF_TH)}
    </div>

    <div class="card">
      <h3>📈 เทรนด์คะแนน <span class="muted" style="font-weight:400;font-size:12px">(${last.length} ครั้งล่าสุด)</span></h3>
      <div class="trend">${trend}</div>
    </div>

    <div class="card">
      <h3>❌ ข้อที่พลาดบ่อยสุด</h3>
      ${missHtml}
    </div>

    <div class="row">
      <a class="btn" href="exam.html">ฝึกต่อ →</a>
      <button class="btn danger" id="reset">ล้างสถิติ</button>
    </div>`;

  const rb=document.getElementById('reset');
  if(rb) rb.addEventListener('click',()=>{
    if(confirm('ล้างสถิติการฝึกทั้งหมดในเครื่องนี้?')){ localStorage.removeItem(KEY); render(); }
  });
}
render();
</script>
</body>
</html>
